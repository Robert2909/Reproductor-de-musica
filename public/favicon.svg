<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d14"/>
      <stop offset="50%" stop-color="#121420"/>
      <stop offset="100%" stop-color="#07080c"/>
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="60%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#neonGlow)" stroke-width="3" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#neonGlow)" stroke-width="2" stroke-opacity="0.25" filter="url(#softGlow)"/>

  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="135" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>

  <g filter="url(#glowFilter)">
    <rect x="246" y="110" width="20" height="292" rx="10" fill="url(#barGrad)"/>
    <rect x="210" y="145" width="18" height="222" rx="9" fill="url(#barGrad)" opacity="0.92"/>
    <rect x="284" y="145" width="18" height="222" rx="9" fill="url(#barGrad)" opacity="0.92"/>
    <rect x="176" y="185" width="16" height="142" rx="8" fill="url(#barGrad)" opacity="0.85"/>
    <rect x="320" y="185" width="16" height="142" rx="8" fill="url(#barGrad)" opacity="0.85"/>
    <rect x="144" y="215" width="14" height="82" rx="7" fill="url(#barGrad)" opacity="0.75"/>
    <rect x="354" y="215" width="14" height="82" rx="7" fill="url(#barGrad)" opacity="0.75"/>
    <rect x="114" y="235" width="12" height="42" rx="6" fill="url(#barGrad)" opacity="0.6"/>
    <rect x="386" y="235" width="12" height="42" rx="6" fill="url(#barGrad)" opacity="0.6"/>
  </g>

  <circle cx="256" cy="256" r="54" fill="#0c0d14" stroke="url(#neonGlow)" stroke-width="3" filter="url(#glowFilter)"/>
  <path d="M 244 234 L 278 256 L 244 278 Z" fill="url(#neonGlow)" filter="url(#glowFilter)"/>
</svg>